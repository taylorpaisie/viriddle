name: Validate private friend leagues
on:
  push:
    branches: [feature/private-friend-leagues]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:connected
      - run: npm run build
        env:
          VITE_BASE_PATH: /viriddle/
# Tests use isolated PGlite fixtures. This workflow never applies SQL or deploys a site.
